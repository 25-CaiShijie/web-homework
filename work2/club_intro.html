<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>琴语钢琴社活动介绍</title><style>body{margin:0;background:#f5f2ec;color:#28343a;font:17px/1.9 "Microsoft YaHei",sans-serif}.box{max-width:850px;margin:60px auto;padding:36px;background:white;border-radius:18px;box-shadow:0 10px 35px #0001}h1{color:#87613d}img{width:100%;max-height:430px;object-fit:cover;border-radius:12px}a{color:#87613d}</style></head><body><main class="box"><h1>琴语钢琴社｜在琴声中相遇</h1><img src="club_intro.jpg" alt="琴语钢琴社活动"><p>琴语钢琴社欢迎每一位喜欢音乐的同学。社团定期开展钢琴基础交流、曲目练习、四手联弹工作坊和校园音乐分享会。无论你已有演奏经验，还是刚刚开始认识琴键，都可以在轻松友好的氛围中找到自己的节奏。</p><p>我们相信音乐属于每个人。成员可以一起练习、互相倾听，也可以参与小型演出，把喜欢的旋律带给更多朋友。加入琴语，让琴声成为校园生活里温暖的一部分。</p><p><a href="zhang-work2.html">← 返回琴语钢琴社招新网页</a></p></main></body></html>
